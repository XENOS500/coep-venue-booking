name: Backend health check

on:
  schedule:
    # Every five minutes, offset from the busiest minute of the hour.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: backend-health
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'XENOS500/coep-venue-booking'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTHCHECK_URL: ${{ vars.BACKEND_HEALTH_URL || 'https://coep-venue-booking.onrender.com/api/v1/health/live' }}
    steps:
      - name: Check API liveness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 75 \
            --retry 2 --retry-delay 5 --retry-max-time 180 \
            --output health.json "$HEALTHCHECK_URL"
          python3 -c 'import json; response = json.load(open("health.json")); assert response.get("data", {}).get("status") == "ok", "Unexpected health response"'
          echo "API is reachable."
